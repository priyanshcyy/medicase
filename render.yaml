services:
  - type: web
    name: medicase-backend
    runtime: python
    buildCommand: cd backend && pip install -r requirements.txt && python seed.py
    startCommand: cd backend && uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET
        generateValue: true
